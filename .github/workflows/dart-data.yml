name: Collect DART financial statements
on:
  workflow_dispatch:
    inputs:
      companies:
        description: '종목코드 (쉼표 구분, 최대 30개)'
        required: true
        default: '005930,000660,006400,005380,035420'
      year:
        description: '마지막 사업연도'
        required: true
        default: '2025'
      span:
        description: '비교 연수 (성장률용 직전 연도도 수집)'
        type: choice
        options: ['3', '5']
        default: '3'
permissions:
  contents: write
concurrency:
  group: dart-data-publish
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx streamlit
      - name: Restore published snapshots
        run: |
          mkdir -p /tmp/dart-published
          if git ls-remote --exit-code --heads origin dart-data >/dev/null; then
            git fetch origin dart-data
            git archive FETCH_HEAD financials | tar -x -C /tmp/dart-published
          fi
      - name: Collect official statements
        id: collect
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          DART_COMPANIES: ${{ inputs.companies }}
          DART_YEAR: ${{ inputs.year }}
          DART_SPAN: ${{ inputs.span }}
        run: python scripts/collect_dart_financials.py --companies "$DART_COMPANIES" --year "$DART_YEAR" --span "$DART_SPAN" --output /tmp/dart-published/financials
      - name: Publish successful snapshots on data branch
        run: |
          test -d /tmp/dart-published/financials || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git show-ref --verify --quiet refs/remotes/origin/dart-data; then
            git checkout -B dart-data origin/dart-data
          else
            git checkout --orphan dart-data
            git rm -rf .
          fi
          mkdir -p financials
          cp /tmp/dart-published/financials/*.json financials/
          git add financials
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh official DART financial snapshots'
            git push origin HEAD:dart-data
          fi
      - name: Report collection failure
        if: steps.collect.outcome == 'failure'
        run: |
          echo 'Some requests failed or DART_API_KEY is missing. Check the collection step; last successful data were retained.'
          exit 1
